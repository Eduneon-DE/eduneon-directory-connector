<div class="modal fade">
  <div class="modal-dialog">
    <form class="modal-content" (ngSubmit)="submit()">
      <div class="modal-header">
        <h3 class="modal-title">{{ "settings" | i18n }}</h3>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <h4>{{ "cockpitServer" | i18n }}</h4>
        <p>{{ "cockpitServerDesc" | i18n }}</p>
        <div class="mb-3">
          <label for="baseUrl" class="form-label">{{ "baseUrl" | i18n }}</label>
          <input
            id="baseUrl"
            type="text"
            name="BaseUrl"
            placeholder="https://app.eduneon.com"
            [ngModel]="baseUrl()"
            (ngModelChange)="baseUrl.set($event)"
            class="form-control"
          />
          <div class="form-text">{{ "cockpitServerHint" | i18n }}</div>
        </div>
      </div>
      <div class="modal-footer justify-content-start">
        <button type="submit" class="btn btn-primary">
          <i class="bwi bwi-save bwi-fw"></i>
          {{ "save" | i18n }}
        </button>
      </div>
    </form>
  </div>
</div>
