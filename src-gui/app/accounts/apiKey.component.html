<div class="container-fluid">
  <form #form="appApiAction" (ngSubmit)="submit()" [appApiAction]="formPromise()">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="text-center mt-4 mb-3">
          <img src="images/logo-mark.png" alt="" height="40" />
        </div>
        <p class="text-center fw-semibold fs-5">{{ "welcome" | i18n }}</p>
        <p class="text-center">{{ "logInDesc" | i18n }}</p>
        <div class="card">
          <h5 class="card-header">{{ "logIn" | i18n }}</h5>
          <div class="card-body">
            <div class="mb-3">
              <label for="api_token" class="form-label">{{ "apiToken" | i18n }}</label>
              <div class="input-group">
                <input
                  type="{{ showSecret() ? 'text' : 'password' }}"
                  id="api_token"
                  name="ApiToken"
                  autocomplete="off"
                  [ngModel]="apiToken()"
                  (ngModelChange)="apiToken.set($event)"
                  class="form-control"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  appA11yTitle="{{ 'toggleVisibility' | i18n }}"
                  (click)="toggleSecret()"
                >
                  <i class="bwi" [ngClass]="showSecret() ? 'bwi-eye-slash' : 'bwi-eye'"></i>
                </button>
              </div>
              <div class="form-text">
                {{ "apiTokenDesc" | i18n }}
                <a [href]="tokenPageUrl()" target="_blank" rel="noreferrer">{{
                  "createApiToken" | i18n
                }}</a>
              </div>
            </div>
            <div class="mb-3">
              <label for="directory_id" class="form-label">{{ "directoryId" | i18n }}</label>
              <input
                id="directory_id"
                name="DirectoryId"
                inputmode="numeric"
                autocomplete="off"
                [ngModel]="directoryId()"
                (ngModelChange)="directoryId.set($event)"
                class="form-control"
              />
              <div class="form-text">{{ "directoryIdDesc" | i18n }}</div>
            </div>
            <div class="mb-3">
              <label for="organization_id" class="form-label">{{ "organizationId" | i18n }}</label>
              <input
                id="organization_id"
                name="OrganizationId"
                inputmode="numeric"
                autocomplete="off"
                [ngModel]="organizationId()"
                (ngModelChange)="organizationId.set($event)"
                class="form-control"
              />
              <div class="form-text">{{ "organizationIdDesc" | i18n }}</div>
            </div>
            <div class="d-flex">
              <div>
                <button type="submit" class="btn btn-primary" [disabled]="form.loading()">
                  <i class="bwi bwi-spinner bwi-fw bwi-spin" [hidden]="!form.loading()"></i>
                  <i class="bwi bwi-sign-in bwi-fw" [hidden]="form.loading()"></i>
                  {{ "logIn" | i18n }}
                </button>
              </div>
              <button type="button" class="btn btn-link ms-auto" (click)="settings()">
                {{ "settings" | i18n }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
<ng-template #environment></ng-template>
