name: Release

# Builds the desktop app and the CLI for every platform and publishes them as a GitHub
# release. Push a tag like `v2026.11.1` (matching package.json "version") to release.
#
# Signing is optional and switches on when the secrets exist:
#   macOS:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID_USERNAME, APPLE_ID_PASSWORD, APPLE_TEAM_ID
#   Windows: Azure Artifact Signing (account eduneon-signing, North Europe), on release tags only:
#            repository variable AZURE_SIGNING_PROFILE (the certificate profile name) and secrets
#            AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID. The login is OIDC (no password):
#            the Entra app needs a federated credential for this repository's environment "release".
# Without them the builds are unsigned: they install, but macOS Gatekeeper and Windows
# SmartScreen show a warning on first launch.

on:
  push:
    tags: ["v*"]
    # Every push to a feature branch builds and tests the installers too; only a tag publishes.
    branches: ["feature/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  setup:
    name: Read versions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      node_version: ${{ steps.v.outputs.node_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: v
        run: |
          VERSION=$(jq -r .version package.json)
          NODE_NVMRC=$(cat .nvmrc)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "node_version=${NODE_NVMRC/v/}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $VERSION"
            exit 1
          fi

  gui:
    name: Desktop app (${{ matrix.name }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            dist: dist:lin
          - name: windows-x64
            os: windows-2022
            dist: dist:win
          - name: macos-x64
            os: macos-15-intel
            dist: dist:mac
          - name: macos-arm64
            os: macos-15
            dist: dist:mac:arm64
    runs-on: ${{ matrix.os }}
    # Signing logs in to Azure with GitHub's OIDC token, bound to the "release" environment.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      WIN_SIGNING: ${{ vars.AZURE_SIGNING_PROFILE != '' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install libdbus-1-dev libsecret-1-dev pkg-config

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ needs.setup.outputs.node_version }}
          platform: ${{ runner.os }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - run: npm ci

      - name: Log in to Azure for code signing
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Artifact Signing module
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery -Scope CurrentUser

      - name: Build and package
        shell: bash
        run: |
          # A missing secret arrives as an empty string, and electron-builder treats an empty
          # CSC_LINK as a certificate path ("... not a file"). Drop empty signing variables so
          # the build falls back to unsigned.
          for v in CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npm run ${{ matrix.dist }}
        env:
          # macOS signing: electron-builder signs when CSC_LINK is set, notarize.mjs
          # notarizes when Apple credentials are set. Both are skipped otherwise.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing via scripts/sign.mjs: empty profile = unsigned build.
          AZURE_SIGNING_PROFILE: ${{ env.WIN_SIGNING == 'true' && vars.AZURE_SIGNING_PROFILE || '' }}
          AZURE_SIGNING_ENDPOINT: https://neu.codesigning.azure.net/
          AZURE_SIGNING_ACCOUNT: eduneon-signing

      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist -Filter *.exe | ForEach-Object { Get-AuthenticodeSignature $_.FullName } |
            Where-Object { $_.Status -ne 'Valid' }
          if ($bad) { $bad | Format-Table Path, Status, StatusMessage -AutoSize; throw 'Unsigned or invalid installer' }
          Get-ChildItem dist -Filter *.exe | ForEach-Object { "$($_.Name): $((Get-AuthenticodeSignature $_.FullName).SignerCertificate.Subject)" }

      - name: Keep per-arch macOS update manifest apart
        if: runner.os == 'macOS'
        run: mv dist/latest-mac.yml "dist/latest-mac-${{ matrix.name }}.yml"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gui-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  cli:
    name: CLI (${{ matrix.name }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            container: ubuntu:20.04 # older glibc so the binary runs on more distros
            dist: dist:cli:lin
          - name: windows
            os: windows-2022
            dist: dist:cli:win
          - name: macos-arm64
            os: macos-15
            dist: dist:cli:mac:arm64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      WIN_SIGNING: ${{ vars.AZURE_SIGNING_PROFILE != '' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get -y install curl ca-certificates git build-essential \
            libdbus-1-dev libsecret-1-dev pkg-config libatomic1 unzip zip jq
          git config --global --add safe.directory '*'

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ needs.setup.outputs.node_version }}
          platform: ${{ runner.os }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - run: npm ci
      - run: npm run build:native:release
      - run: npm run ${{ matrix.dist }}

      - name: Log in to Azure for code signing
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign eduneon-dc.exe
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://neu.codesigning.azure.net/
          signing-account-name: eduneon-signing
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist-cli\windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the CLI signature
        if: runner.os == 'Windows' && env.WIN_SIGNING == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist-cli\windows\eduneon-dc.exe
          if ($sig.Status -ne 'Valid') { throw "eduneon-dc.exe: $($sig.Status) $($sig.StatusMessage)" }
          $sig.SignerCertificate.Subject

      - name: Zip and check version
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          EDUNEON_DC_PLAINTEXT_SECRETS: "true"
        run: |
          DIR="dist-cli/${{ matrix.name }}"
          ZIP="eduneon-dc-${{ matrix.name }}-$VERSION.zip"
          BIN="$DIR/eduneon-dc"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          GOT=$("$BIN" -v)
          if [ "$GOT" != "$VERSION" ]; then echo "::error::version $GOT != $VERSION"; exit 1; fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist-cli/$ZIP" "./$DIR/*"
          else
            (cd "$DIR" && zip -r "../$ZIP" .)
          fi

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cli-${{ matrix.name }}
          path: dist-cli/eduneon-dc-*.zip
          if-no-files-found: error

  # Installs what was just built the way an admin would, from the command line, on a clean machine of each
  # system, and checks that the CLI and the desktop app start. A release is only published when this passes.
  # (It cannot sync: GitHub's machines reach no Cockpit or directory.)
  smoke:
    name: Install test (${{ matrix.name }})
    needs: [setup, gui, cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2025
            gui: gui-windows-x64
            cli: cli-windows
          - name: linux
            os: ubuntu-24.04
            gui: gui-linux-x64
            cli: cli-linux
          - name: macos
            os: macos-15
            gui: gui-macos-arm64
            cli: cli-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.setup.outputs.node_version }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ matrix.gui }}
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ matrix.cli }}
          path: artifacts

      - name: Windows - install the CLI and the app, start both
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem artifacts -Filter "eduneon-dc-windows-*.zip" | Select-Object -First 1
          $setup = Get-ChildItem artifacts -Filter "Eduneon-Directory-Connector-Setup-*.exe" | Select-Object -First 1
          ./scripts/install.ps1 -From $zip.FullName
          $cli = Join-Path $env:LOCALAPPDATA "Programs\eduneon-dc\eduneon-dc.exe"
          $version = & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "eduneon-dc --version failed" }
          Write-Host "CLI version: $version"
          ./scripts/install.ps1 -From $setup.FullName
          $app = Get-ChildItem "$env:ProgramFiles", "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Eduneon Directory Connector.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "The desktop app was not installed" }
          Write-Host "App installed: $($app.FullName)"
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "The desktop app exited with code $($process.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$PWD/screenshot-windows.png")
          Stop-Process -Id $process.Id -Force

      - name: Linux - install the CLI and the app, start both
        if: matrix.name == 'linux'
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick libfuse2t64 >/dev/null
          sh scripts/install.sh --from artifacts/eduneon-dc-linux-*.zip
          echo "CLI version: $("$HOME/.local/bin/eduneon-dc" --version)"
          sh scripts/install.sh --from artifacts/*.AppImage
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          "$HOME/.local/bin/eduneon-directory-connector" --no-sandbox &
          app=$!
          sleep 20
          kill -0 "$app" || { echo "The desktop app exited"; exit 1; }
          import -window root screenshot-linux.png
          kill "$app"

      - name: macOS - install the CLI and the app, start both
        if: matrix.name == 'macos'
        run: |
          set -eu
          sh scripts/install.sh --from artifacts/eduneon-dc-macos-arm64-*.zip
          echo "CLI version: $("$HOME/.local/bin/eduneon-dc" --version)"
          sh scripts/install.sh --app --from artifacts/*-arm64.dmg --apps-dir "$HOME/Applications"
          app="$HOME/Applications/Eduneon Directory Connector.app"
          codesign --verify --deep --strict "$app"
          open "$app"
          sleep 20
          pgrep -f "Eduneon Directory Connector.app/Contents/MacOS" >/dev/null || { echo "The desktop app exited"; exit 1; }
          screencapture -x screenshot-macos.png || true
          pkill -f "Eduneon Directory Connector.app/Contents/MacOS" || true

      # The installed CLI, set up from the terminal as on a customer's server, against a test LDAP and a
      # test Cockpit on the same machine: configure, test, log in, sync, check what arrived.
      - name: End-to-end sync with the installed CLI
        shell: bash
        run: |
          set -eu
          if [ "${{ matrix.name }}" = windows ]; then
            CLI="$LOCALAPPDATA/Programs/eduneon-dc/eduneon-dc.exe"
          else
            CLI="$HOME/.local/bin/eduneon-dc"
          fi
          (cd test/e2e && npm ci --no-audit --no-fund)
          node test/e2e/e2e.mjs "$CLI"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: install-test-${{ matrix.name }}
          path: screenshot-*.png
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [setup, gui, cli, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: out
          merge-multiple: true

      - name: Merge macOS update manifests
        # electron-updater reads one latest-mac.yml listing both architectures.
        run: |
          cd out
          # The install tests' screenshots are for the run, not for users.
          rm -f screenshot-*.png
          {
            head -n 2 latest-mac-macos-x64.yml           # version + "files:"
            sed -n '/^files:/,/^path:/{/^files:/d;/^path:/d;p}' latest-mac-macos-x64.yml
            sed -n '/^files:/,/^path:/{/^files:/d;/^path:/d;p}' latest-mac-macos-arm64.yml
            sed -n '/^path:/,$p' latest-mac-macos-x64.yml
          } > latest-mac.yml
          rm latest-mac-macos-*.yml
          cat latest-mac.yml

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Eduneon Directory Connector $TAG" \
            --generate-notes
